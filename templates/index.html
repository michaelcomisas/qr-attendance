<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR-Attend | Web-Based Attendance System</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;650;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
:root{--bg:#eef1f4;--sf:#fff;--ink:#12202e;--mut:#5d6b7a;--line:#dbe1e8;--brand:#2f4bff;--on:#fff;
--ok:#14804a;--okb:#e3f4ea;--warn:#a85d00;--warnb:#fdf0d9;--bad:#b42318;--badb:#fde8e6}
@media(prefers-color-scheme:dark){:root{--bg:#0e1620;--sf:#16212d;--ink:#e8eef4;--mut:#93a1b0;--line:#26343f;--brand:#6c82ff;--on:#0e1620;
--ok:#5fd08f;--okb:#12301f;--warn:#f0b35a;--warnb:#35280f;--bad:#ff8b80;--badb:#3a1714}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
h1,h2{margin:0;line-height:1.15;letter-spacing:-.02em}h1{font-size:clamp(1.8rem,4vw,2.5rem)}h2{font-size:1.15rem}
.mut{color:var(--mut)}.sm{font-size:.875rem}:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
header{background:var(--sf);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header>div{max-width:1080px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:16px}
.brand{font-weight:750;font-size:1.1rem;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.logo{width:22px;height:22px;border:3px solid var(--brand);border-radius:6px;position:relative}
.logo:after{content:"";position:absolute;inset:3px;background:var(--brand)}
.nav{margin-left:auto;display:flex;gap:4px}
.nav button{font:inherit;font-weight:600;border:0;background:none;color:var(--mut);padding:8px 14px;border-radius:8px;cursor:pointer}
.nav button:hover{background:var(--bg)}.nav button[aria-selected=true]{color:var(--ink);background:var(--bg)}
main{max-width:1080px;margin:0 auto;padding:36px 20px 64px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:22px}
.btn{font:inherit;font-weight:650;border:1px solid var(--line);background:var(--sf);color:var(--ink);padding:9px 16px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--mut)}.btn.pri{background:var(--brand);color:var(--on);border-color:var(--brand)}.btn.dng{color:var(--bad)}
.btn{white-space:nowrap;flex-shrink:0}
label{display:block;font-weight:600;font-size:.875rem;margin-bottom:6px}
input{font:inherit;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:var(--sf);color:var(--ink)}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.hidden{display:none!important}
/* scanner */
.scan{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.scan p.lead{max-width:34ch;margin:12px 0 0}
.seg{display:inline-flex;background:var(--bg);border-radius:9px;padding:3px;margin-top:20px}
.seg button{font:inherit;font-weight:600;border:0;background:none;padding:7px 14px;border-radius:7px;color:var(--mut);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--sf);color:var(--ink);box-shadow:0 1px 2px #0002}
.row{display:flex;gap:8px;margin-top:20px}
.vf{position:relative;background:#0b121a;border-radius:14px;overflow:hidden;aspect-ratio:1;display:grid;place-items:center}
.vf #reader{width:100%}.vf video{object-fit:cover}
.vf i{position:absolute;width:44px;height:44px;border:4px solid #fff;pointer-events:none;transition:border-color .2s}
.vf .tl{top:18px;left:18px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}.vf .tr{top:18px;right:18px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.vf .bl{bottom:18px;left:18px;border-right:0;border-top:0;border-radius:0 0 0 10px}.vf .br{bottom:18px;right:18px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.vf.ok i{border-color:#4ade80}.vf.bad i{border-color:#ff7b6e}
.nocam{color:#9fb0c0;text-align:center;padding:30px;font-size:.9375rem}
.res{display:none;margin-top:16px;padding:16px 18px;border-radius:10px;border:1px solid;gap:14px;align-items:center}
.res.show{display:flex}.res b{display:block;font-size:1.05rem}.res .t{margin-left:auto;font-weight:700}
.res.ok{background:var(--okb);color:var(--ok);border-color:var(--ok)}.res.warn{background:var(--warnb);color:var(--warn);border-color:var(--warn)}.res.bad{background:var(--badb);color:var(--bad);border-color:var(--bad)}
details{margin-top:24px}summary{cursor:pointer;color:var(--mut);font-size:.875rem}
details .row{margin-top:10px;flex-wrap:wrap}
/* dashboard */
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input{width:auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{padding:18px 20px}.stat b{display:block;font-size:2.2rem;letter-spacing:-.03em;line-height:1.1}
.stat.ok b{color:var(--ok)}.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:18px;align-items:start}
table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:600;color:var(--mut);font-size:.875rem;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}
.id{font-family:ui-monospace,Consolas,monospace;font-size:.875rem}.empty{padding:36px 12px;text-align:center;color:var(--mut)}
.pill{padding:2px 10px;border-radius:99px;font-size:.8125rem;font-weight:650}
.pill.PRESENT{background:var(--okb);color:var(--ok)}.pill.LATE{background:var(--warnb);color:var(--warn)}
ul{list-style:none;margin:8px 0 0;padding:0}li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}li:last-child{border:0}
@media(max-width:820px){.scan,.cols{grid-template-columns:1fr}.scan{gap:24px}.stats{grid-template-columns:1fr 1fr}.brand span{display:none}.nav button{padding:8px 10px}}
.nav a{font-weight:600;color:var(--mut);padding:8px 14px;border-radius:8px;text-decoration:none}
.nav a:hover{background:var(--bg)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div>
  <div class="brand"><span class="logo"></span><span>QR-Attend</span></div>
<div class="nav" role="tablist">
  <button role="tab" id="tabS" aria-selected="true" onclick="switchTab('student')">Check in</button>
  <button role="tab" id="tabT" aria-selected="false" onclick="switchTab('teacher')">Dashboard</button>
  <a href="/students">Students</a>
</div>
</div></header>

<main>
<!-- STUDENT CHECK-IN -->
<section id="studentView" class="scan">
  <div>
    <h1>Check in to class</h1>
    <p class="lead mut" id="hint">Enter your Student ID, then point your camera at the class QR code your teacher is showing.</p>
    <div class="seg" role="group" aria-label="Check-in mode">
      <button id="mClass" aria-pressed="true">Class QR code</button>
      <button id="mBadge" aria-pressed="false">Student badge</button>
    </div>
    <div style="margin-top:24px" id="idField">
      <label for="sid">Student ID</label>
      <input id="sid" placeholder="2024-0001" autocomplete="off">
    </div>
    <div class="row">
      <input id="manual" placeholder="Camera not working? Type the code" aria-label="Class QR code text">
      <button class="btn pri" id="go">Check in</button>
    </div>
    <details>
      <summary>Test scenarios</summary>
      <div class="row">
        <button class="btn" onclick="sim('CLASS-101-ATTENDANCE-KEY','2024-0001')">Valid scan</button>
        <button class="btn" onclick="sim('INVALID_QR_SECRET','2024-0001')">Invalid QR</button>
        <button class="btn" onclick="sim('CLASS-101-ATTENDANCE-KEY','UNREGISTERED_ID')">Not found</button>
      </div>
    </details>
  </div>
  <div>
    <div class="vf" id="vf"><div id="reader"></div><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
    <div class="res" id="res" role="status" aria-live="polite"><div><b id="rt"></b><span class="sm" id="rm"></span></div><span class="t" id="rtime"></span></div>
  </div>
</section>

<!-- TEACHER DASHBOARD -->
<section id="teacherView" class="hidden">
  <div class="head">
    <div><h1>Attendance</h1><p class="mut" id="sub"></p></div>
    <div class="tools">
      <input type="date" id="date" aria-label="Date">
      <button class="btn" onclick="exportCSV()">Export CSV</button>
      <button class="btn dng" onclick="clearLogs()">Clear all logs</button>
    </div>
  </div>
  <div class="stats">
    <div class="card stat"><b id="sTotal">0</b><span class="mut">Registered</span></div>
    <div class="card stat ok"><b id="sPres">0</b><span class="mut">Present</span></div>
    <div class="card stat warn"><b id="sLate">0</b><span class="mut">Late</span></div>
    <div class="card stat bad"><b id="sAbs">0</b><span class="mut">Not yet in</span></div>
  </div>
  <div class="cols">
    <div class="card" style="padding:8px 10px">
      <table><thead><tr><th>Student</th><th>Class</th><th>Time</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table>
    </div>
    <div style="display:grid;gap:18px">
  <div class="card" style="text-align:center">
    <h2>Class QR code</h2>
    <p class="mut sm" style="margin:4px 0 14px">{{ class_label }}. Show this to students.</p>
    <img src="/api/qr?d={{ class_qr|urlencode }}" alt="Class QR code" style="width:100%;max-width:220px;border-radius:8px;background:#fff">
  </div>
  <div class="card"><h2>Not yet in</h2><ul id="absent"></ul></div>
</div>
  </div>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let busy = false, logs = [], timer = null;

/* ---------- tabs ---------- */
function switchTab(t) {
  const s = t === 'student';
  $('studentView').classList.toggle('hidden', !s);
  $('teacherView').classList.toggle('hidden', s);
  $('tabS').setAttribute('aria-selected', s);
  $('tabT').setAttribute('aria-selected', !s);
  clearInterval(timer);
  if (!s) { loadDashboard(); timer = setInterval(loadDashboard, 10000); }
}

/* ---------- check-in ---------- */
function setMode(badge) {
  $('mClass').setAttribute('aria-pressed', !badge);
  $('mBadge').setAttribute('aria-pressed', badge);
  $('idField').classList.toggle('hidden', badge);
  $('hint').textContent = badge
    ? 'Hold your personal badge QR up to the camera. No ID needed.'
    : 'Enter your Student ID, then point your camera at the class QR code your teacher is showing.';
}
$('mClass').onclick = () => setMode(false);
$('mBadge').onclick = () => setMode(true);

function show(kind, title, msg, time, ring) {
  const r = $('res');
  r.className = 'res show ' + kind;
  $('rt').textContent = title; $('rm').textContent = msg || ''; $('rtime').textContent = time || '';
  $('vf').classList.remove('ok', 'bad');
  if (ring) $('vf').classList.add(ring);
}

async function send(code, id) {
  if (busy || !code) return;
  const isBadge = code.startsWith('STU-');
  if (!isBadge && !id) { show('warn', 'Student ID needed', 'Enter your Student ID first.', '', ''); return; }
  busy = true;
  try {
    const r = await fetch('/api/scan', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ qr_code: code, student_id: id })
    });
    const d = await r.json();
    if (d.status === 'success')
      show('ok', d.attendance === 'LATE' ? 'Checked in late' : 'Present', `${d.student_name} · ${d.class_name}`, d.time, 'ok');
    else if (d.status === 'duplicate')
      show('warn', 'Already checked in', d.message, d.time, 'ok');
    else if (d.status === 'not_found')
      show('warn', 'Student not found', d.message, '', 'bad');
    else if (d.status === 'invalid_qr')
      show('bad', 'Wrong QR code', d.message, '', 'bad');
    else
      show(r.ok ? 'ok' : 'bad', r.ok ? 'Present' : 'Check in failed', d.message, '', r.ok ? 'ok' : 'bad');
  } catch (e) {
    show('bad', 'Server unreachable', 'Make sure app.py is running.', '', 'bad');
  }
  setTimeout(() => { busy = false; $('vf').classList.remove('ok', 'bad'); }, 3000);
}
const sid = () => $('sid').value.trim();
$('go').onclick = () => send($('manual').value.trim(), sid());
$('manual').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
function sim(code, id) { $('sid').value = id; send(code, id); }

(function startCamera() {
  const noCam = () => { $('reader').innerHTML = '<p class="nocam">Camera unavailable. Allow camera access (needs https or localhost), or type the code instead.</p>'; };
  try {
    new Html5Qrcode('reader')
      .start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 220, height: 220 } }, t => send(t, sid()))
      .catch(noCam);
  } catch (e) { noCam(); }
})();

/* ---------- dashboard ---------- */
$('date').value = new Date().toLocaleDateString('en-CA');
$('date').onchange = loadDashboard;

async function loadDashboard() {
  try {
    const d = await (await fetch('/api/dashboard?date=' + $('date').value)).json();
    logs = d.logs || [];
    const late = d.late ?? 0, present = d.present ?? d.present_today ?? 0;
    const absent = d.absent || [];
    $('sTotal').textContent = d.total_students;
    $('sPres').textContent = Math.max(present - late, 0);
    $('sLate').textContent = late;
    $('sAbs').textContent = d.absent ? absent.length : Math.max(d.total_students - present, 0);
    $('sub').textContent = new Date(($('date').value) + 'T00:00').toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric', year:'numeric'});
    $('rows').innerHTML = logs.length ? logs.map(l => `
      <tr><td><b>${esc(l.name)}</b><br><span class="id mut">${esc(l.student_id)}</span></td>
      <td>${esc(l.class_name)}</td><td>${esc(String(l.scanned_at).slice(11, 16))}</td>
      <td><span class="pill ${esc(l.status)}">${esc(l.status[0] + l.status.slice(1).toLowerCase())}</span></td></tr>`).join('')
      : '<tr><td colspan="4" class="empty">No check-ins yet for this date.</td></tr>';
    $('absent').innerHTML = absent.length
      ? absent.map(s => `<li><span>${esc(s.name)}</span><span class="id mut">${esc(s.student_id)}</span></li>`).join('')
      : '<li class="mut">Everyone is in.</li>';
  } catch (e) { console.error('Dashboard error:', e); }
}

async function clearLogs() {
  if (!confirm('Delete every attendance log for all dates? This cannot be undone.')) return;
  await fetch('/api/clear-logs', { method: 'POST' });
  loadDashboard();
}

function exportCSV() {
  if (!logs.length) { alert('No attendance records to export for this date.'); return; }
  const cell = v => { v = String(v ?? ''); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
  const csv = ['Student ID,Name,Class,Scanned at,Status']
    .concat(logs.map(l => [l.student_id, l.name, l.class_name, l.scanned_at, l.status].map(cell).join(','))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `Attendance_${$('date').value}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}
</script>
</body>
</html>
